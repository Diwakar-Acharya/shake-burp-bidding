<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shake&Burp | Exclusive Drops</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3.0">
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    {% include 'components/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("scroll", function() {
            const navbar = document.getElementById("mainNav");
            
            // Safety check to make sure the navbar exists on the page before trying to change it
            if (navbar) {
                if (window.scrollY > 50) {
                    // If scrolled down more than 50px, add the dark background
                    navbar.classList.add("nav-scrolled");
                } else {
                    // If at the top, keep it fully transparent
                    navbar.classList.remove("nav-scrolled");
                }
            }
        });
    </script>
</body>
</html>
